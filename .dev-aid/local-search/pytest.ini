[pytest]
# Pytest configuration for Dev-AID Local Search

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
# NOTE: coverage is scoped to the source packages, not ".", because "." also
# swept the local venv/stdlib and reported a bogus ~19% that failed the gate
# on a fully green run — i.e. the gate never actually gated (audit M-cov).
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=chunking
    --cov=embeddings
    --cov=search
    --cov=utils
    --cov=mcp_server
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=30

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Coverage options
[coverage:run]
source = .
omit =
    tests/*
    */tests/*
    */__pycache__/*
    */venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
